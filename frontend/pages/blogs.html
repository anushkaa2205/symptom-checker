<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Insights &amp; Blogs | Medora</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="description" content="Trending health news and practical articles on diabetes, heart health, mental health, nutrition and more, curated by Medora.">
    <meta name="theme-color" content="#02050A">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="canonical" href="https://medora-2uyi.onrender.com/blogs">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Medora">
    <meta property="og:title" content="Health Insights &amp; Blogs | Medora">
    <meta property="og:description" content="Trending health news and practical articles on diabetes, heart health, mental health, nutrition and more, curated by Medora.">
    <meta property="og:url" content="https://medora-2uyi.onrender.com/blogs">
    <meta property="og:image" content="https://medora-2uyi.onrender.com/assets/og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://medora-2uyi.onrender.com/assets/og-image.jpg">
    <!-- Only hide content for the reveal animation when JavaScript is running -->
    <script>document.documentElement.classList.add('js');</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/blogs.css">
    <link rel="stylesheet" href="/css/global.css">
</head>
<body>

    <div class="ambient-bg"></div>


    <div id="navbar"></div>

    <main class="blogs-container">

        <header class="blog-hero reveal">
            <div class="hero-content">
                <div class="hero-text">
                    <h1>Health Resources & Insights</h1>
                    <p>Trusted articles, medical awareness guides, and wellness resources curated for you.</p>
                    
                    <div class="category-pills">
                        <button class="pill active" data-category="all">All</button>
                        <button class="pill" data-category="Heart Health">Heart Health</button>
                        <button class="pill" data-category="Mental Health">Mental Health</button>
                        <button class="pill" data-category="Nutrition">Nutrition</button>
                        <button class="pill" data-category="Immunity">Immunity</button>
                        <button class="pill" data-category="Emergency Care">Emergency Care</button>
                        <button class="pill" data-category="Wellness">Wellness</button>
                    </div>
                </div>
            </div>
        </header>


        <section class="recommended-section reveal" id="recommended-section" style="display: none;">
            <div class="section-header">
                <h2 class="section-title">Recommended For You</h2>
                <p class="section-subtitle">Based on your recent health activity</p>
            </div>
            <div class="recommended-grid" id="recommended-grid">
            </div>
        </section>


        <section class="trending-section reveal">
            <div class="section-header">
                <h2 class="section-title">Trending Medical News</h2>
            </div>
            <div class="trending-carousel" id="trending-carousel">
                <div class="trending-track" id="trending-track">
                </div>
            </div>
        </section>


        <section class="articles-section reveal">
            <h2 class="section-title">Featured Articles</h2>
            <div class="article-grid" id="article-grid">
            </div>
            <div class="load-more-container" id="load-more-container">
                <button class="load-more-btn" id="load-more-btn">Load More</button>
            </div>
        </section>
    </main>


    <div class="article-modal-overlay" id="article-modal-overlay">
        <div class="article-modal" id="article-modal">
            <button class="modal-close-btn" id="modal-close-btn" aria-label="Close">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
            <img class="modal-hero-img" id="modal-hero-img" src="" alt="">
            <div class="modal-body">
                <span class="article-category" id="modal-category"></span>
                <h2 id="modal-title"></h2>
                <div class="modal-meta" id="modal-meta"></div>
                <div class="modal-content" id="modal-content"></div>
            </div>
        </div>
    </div>

    <script src="/js/navbar.js"></script>
    <script src="/js/blogs.js"></script>
</body>
</html>
